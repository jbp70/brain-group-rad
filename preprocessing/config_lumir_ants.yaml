# LUMIR re-registered affinely (12 DOF) to MNI152 1 mm with ANTs, for retraining on cleanly
# affine-aligned data. Input = the PROCESSED LUMIR cases (manifest from
# scripts/lumir_ants_manifest.py, dataset lumir_ants): already skull-stripped, bias-corrected and
# on the LUMIR grid with the MNI-world affine, so only register (antsRegistration Rigid + Affine,
# MI, defaults in preprocessing/config.py) -> one resampling onto the LUMIR grid (image Linear,
# labels GenericLabel) -> p99.5 normalisation -> QC run.
# Kept per case in <out-root>/lumir_ants/<case>/: image.nii.gz, labels_synthsegsrc.nii.gz
# (rename to labels_synthseg.nii.gz afterwards; 'synthseg' is reserved for the SynthSeg step),
# labels_lumir10.nii.gz (val cases), affine_to_template.mat = R_i (ITK, processed LUMIR image ->
# MNI152 1 mm; the residual affine of the current LUMIR alignment), meta.json, qc.json.
target_dir: /autofs/space/crater_001/users/jn85/BrainRegProjects/GroupwiseReg/data/target_grid

# 4-level schedule (antsRegistrationSyN.sh values). The 3-level default of config.py
# (1000x500x250, 4x2x1, 2x1x0vox) makes ANTs 2.4.4 segfault (signal 11) at the start of the
# Affine stage after the Rigid stage, on every LUMIR case tried (glacier, 2026-11-14; any thread
# count, --float 0/1, collapse 0/1, seed, sampling). 4 levels: no crash, ~1 min per case on 6 threads.
registration:
  backend: ants
  ants:
    transform: Affine
    random_seed: 42
    use_masks: false
    convergence: "[1000x500x250x100,1e-6,10]"
    shrink_factors: "8x4x2x1"
    smoothing_sigmas: "3x2x1x0vox"
    # Image resampling kernel (antsApplyTransforms -n; labels always GenericLabel). Linear
    # visibly smoothed the images (one extra interpolation of the organisers' LUMIR array);
    # windowed sinc keeps them sharp. Slight undershoot at the brain edge is clipped to 0 by the
    # normalisation.
    image_interp: LanczosWindowedSinc

outputs: {keep_work: false, save_mask: false, save_qc_png: false}
