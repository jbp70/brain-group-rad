# Mindboggle-101 HLN-* subjects (native files, own FLIRT registration; manifest from
# `build-manifest --dataset mindboggle --mb-select native`). Same as config_mindboggle.yaml
# except the brain mask is the SynthStrip mask alone: the HLN labels reach too far outside
# the brain (e.g. cerebellum), so they are not added to the mask.
target_dir: /autofs/space/crater_001/users/jn85/BrainRegProjects/GroupwiseReg/data/target_grid

# Labels outside the SynthStrip mask are set to 0 (count per file in meta.json
# labels_zeroed_outside_mask).
mask: {union_labels: false, zero_labels_outside: true}

# Evaluation only: keep image, labels, meta/qc json; delete work/ intermediates.
outputs: {keep_work: false, save_mask: false, save_qc_png: false}
